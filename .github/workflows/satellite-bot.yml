# Kickstart GitHub Actions
name: Hourly Satellite Downloader

on:
  schedule:
    - cron: '0 * * * *' # Standard cron syntax
  workflow_dispatch:     # Allows manual triggering via the GitHub UI/CLI
  push:
    branches: [ main ]

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    # Step 1: Clone your repo onto the GitHub Linux runner
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Make sure your actual script has execute permissions
    - name: Make script executable
      run: chmod +x ./satellite_downloader.sh

    # Step 3: Run your actual Bash script to download the image
    - name: Run Downloader Script
      run: ./satellite_downloader.sh

    # Step 4: Commit and Push the new image back to your folder
    - name: Commit and Push Images
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add satellite_images/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated download: $(date)" && git push)
